<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33d17a"/>
      <stop offset="1" stop-color="#26a269"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square backdrop, GNOME app-icon style -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#0f5132" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Display strip -->
  <rect x="30" y="26" width="68" height="22" rx="6" fill="#ffffff"/>
  <rect x="66" y="33" width="26" height="4" rx="2" fill="#26a269"/>
  <rect x="52" y="33" width="9" height="4" rx="2" fill="#26a269" fill-opacity="0.55"/>

  <!-- Button grid: 3 columns x 4 rows of rounded keys -->
  <g fill="#ffffff">
    <rect x="30" y="58" width="18" height="14" rx="4"/>
    <rect x="55" y="58" width="18" height="14" rx="4"/>
    <rect x="80" y="58" width="18" height="14" rx="4"/>

    <rect x="30" y="76" width="18" height="14" rx="4"/>
    <rect x="55" y="76" width="18" height="14" rx="4"/>
    <rect x="80" y="76" width="18" height="14" rx="4"/>

    <rect x="30" y="94" width="18" height="14" rx="4"/>
    <rect x="55" y="94" width="18" height="14" rx="4"/>
  </g>

  <!-- Accent equals key (bottom-right), tinted to stand out -->
  <rect x="80" y="94" width="18" height="14" rx="4" fill="#ffffff"/>
  <g fill="#26a269">
    <rect x="84" y="98" width="10" height="2.4" rx="1.2"/>
    <rect x="84" y="103" width="10" height="2.4" rx="1.2"/>
  </g>
</svg>
