[package]
name = "calculator"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A native GTK4/libadwaita calculator — Google Calculator-style, mobile-first"
license = "GPL-3.0-or-later"
repository = "https://github.com/syntheit/calculator"
readme = "README.md"
keywords = ["gtk4", "libadwaita", "calculator"]
categories = ["gui"]
default-run = "calculator"

[[bin]]
name = "calculator"
path = "src/main.rs"

[dependencies]
# GTK / libadwaita bindings. v4_12 ABI floor; libadwaita v1_6.
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }

# History persistence to the XDG data dir as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# XDG data dir for the history file ($XDG_DATA_HOME/calculator).
directories = "5"

# Typed engine/state errors (matches Warden's house style).
thiserror = "2"

# Structured logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
